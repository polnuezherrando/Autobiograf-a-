<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora</title>

<style>
    body {
        font-family: Arial;
        background: #f2f2f2;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .calc {
        background: white;
        padding: 20px;
        border-radius: 15px;
        width: 260px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    input {
        width: 100%;
        height: 50px;
        font-size: 20px;
        text-align: right;
        margin-bottom: 10px;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
    }

    button {
        height: 50px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        background: #e6e6e6;
        cursor: pointer;
    }

    button:hover {
        background: #d0d0d0;
    }

    .equal {
        background: #0095f6;
        color: white;
    }

    .nav {
        display: block;
        margin-top: 10px;
        padding: 10px;
        text-decoration: none;
        border-radius: 8px;
        color: white;
        font-weight: bold;
    }

    .back {
        background: #222;
    }
</style>
</head>

<body>

<div class="calc">

<input type="text" id="display" disabled>

<div class="buttons">
    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button onclick="borrar()">←</button>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button onclick="add('/')">/</button>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button onclick="add('*')">*</button>

    <button onclick="add('0')">0</button>
    <button onclick="clearDisplay()">C</button>
    <button onclick="calc()" class="equal">=</button>
    <button onclick="add('+')">+</button>
</div>

<a class="nav back" href="pagina2.html">⬅ Tornar enrere</a>

</div>

<script>
let display = document.getElementById("display");

function add(v){
    display.value += v;
}

function clearDisplay(){
    display.value = "";
}

function borrar(){
    display.value = display.value.slice(0, -1);
}

function calc(){
    try {
        display.value = eval(display.value);
    } catch {
        display.value = "Error";
    }
}
</script>

</body>
</html>
